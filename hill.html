<!DOCTYPE html>
<html lang="en"><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bola no monte</title>
    <style>
        body {
            margin: 0;
            background: #1e1e1e;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        .canvas-container {
            position: relative;
            display: inline-block;
        }
        canvas {
            background: #2e2e2e;
            margin-top: 10px;
            border-radius: 10px;
            display: block;
        }
        .controls {
            margin-top: 10px;
        }
        /* floating info box */
        #infoBox {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 14px;
            line-height: 1.4;
            pointer-events: none; /* let clicks pass through to canvas */
            color: #fff;
        }
    </style>
<body>
<a href="/physics-pg"><- back to index</a>
<h2>Azul: melhor ângulo</h2>

<div class="canvas-container">
    <canvas id="scene" width="900" height="1200"></canvas>
    <div id="infoBox">
        <b>Best angle:</b> 36.65°<br>
        <b>Angle:</b> 45.55°
      </div>
</div>

<div class="controls">
    <label for="slope">Hill steepness: </label>
    <input type="range" id="slope" min="0" max="1.1" step="0.01" value="0.3">
    <label for="angle">Throw angle: </label>
    <input type="range" id="angle" min="0" max="1.5" step="0.001" value="0.795">
</div>

<script>
    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");
    const slopeSlider = document.getElementById("slope");
    const angleSlider = document.getElementById("angle");
    const infoBox = document.getElementById("infoBox");

    const width = canvas.width;
    const height = canvas.height;
    const g = 9.81;
    const scale = 30;
    const v0 = 10;
    const x0 = 100;
    const y0 = height - 900;

    function drawScene(slope, angle) {
        ctx.clearRect(0, 0, width, height);
        let bestangle = (Math.PI / 4) + (Math.atan(-slope) / 2);

        // --- Hill ---
        ctx.beginPath();
        ctx.moveTo(0, height);
        ctx.lineTo(0, y0 + slope * (0 - x0));
        ctx.lineTo(width, y0 + slope * (width - x0));
        ctx.lineTo(width, height);
        ctx.closePath();
        ctx.fillStyle = "#228B22";
        ctx.fill();

        // --- Best trajectory ---
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        for (let t = 0; t < 6; t += 0.02) {
            const x = x0 + v0 * Math.cos(bestangle) * t * scale;
            const y = y0 - (v0 * Math.sin(bestangle) * t - 0.5 * g * t * t) * scale;
            if (x > width || y > height) break;
            ctx.lineTo(x, y);
        }
        ctx.strokeStyle = "blue";
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // --- User trajectory ---
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        for (let t = 0; t < 6; t += 0.02) {
            const x = x0 + v0 * Math.cos(angle) * t * scale;
            const y = y0 - (v0 * Math.sin(angle) * t - 0.5 * g * t * t) * scale;
            if (x > width || y > height) break;
            ctx.lineTo(x, y);
        }
        ctx.strokeStyle = "orange";
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // --- Launch point ---
        ctx.beginPath();
        ctx.arc(x0, y0, 6, 0, 2 * Math.PI);
        ctx.fillStyle = "red";
        ctx.fill();

        // --- Update info box ---
        const bestDeg = bestangle * 180 / Math.PI;
        const angleDeg = angle * 180 / Math.PI;
        infoBox.innerHTML = `
        <b>Best angle:</b> ${bestDeg.toFixed(2)}°<br>
        <b>Angle:</b> ${angleDeg.toFixed(2)}°
      `;
    }

    function render() {
        const slope = parseFloat(slopeSlider.value);
        const angle = parseFloat(angleSlider.value);
        drawScene(slope, angle);
    }

    slopeSlider.addEventListener("input", render);
    angleSlider.addEventListener("input", render);
    render();
</script>


</body></html>
